spring.application.name=cloud-storage

# Database - Supabase (Session Pooler)
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.yambmdqmznqrivdwmrdi
spring.datasource.password=${CS_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

server.port=${PORT:8080}
# Render assigns a random port at runtime via the PORT env var and expects
# the app to bind to it - hardcoding 8080 would make the app unreachable
# on Render even though it starts up fine. Locally, PORT isn't set, so
# this falls back to 8080 exactly like before - no change for local dev.

# CORS - comma-separated list of frontend origins allowed to call this API.
# Spring Boot automatically maps an env var named CORS_ALLOWED_ORIGINS to
# this cors.allowed-origins property - you don't need to uncomment
# anything here, just set CORS_ALLOWED_ORIGINS on Render once your
# frontend has a real URL, e.g.:
# https://your-frontend.vercel.app,http://localhost:5173
# If the env var isn't set at all (like on your local machine), it falls
# back to the localhost defaults defined in SecurityConfig.

# Supabase Storage
# supabase.url is your project's base URL (Project Settings -> API -> Project URL),
# NOT the database pooler host from application.properties above - different thing.
supabase.url=https://yambmdqmznqrivdwmrdi.supabase.co
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.bucket=files

# File upload limits - without these, Spring's defaults are quite small
# and large uploads fail with a confusing error before reaching your code.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB